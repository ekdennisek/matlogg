name: Build docker image and push it to a registry

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build, tag, and push image to registry
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

  update-infra:
    name: Update image tag in infra repo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Bump image tag
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: $REGISTRY/$IMAGE_NAME:.*|image: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG|" k8s/pokeshop/pokeshop.yaml

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Image tag already up to date, nothing to commit"
            exit 0
          fi
          git commit -am "Deploy pokeshop $IMAGE_TAG"
          git push
